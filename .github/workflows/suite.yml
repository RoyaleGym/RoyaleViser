name: suite
on:
  push:
  pull_request:
  workflow_dispatch:

  # A NIGHTLY, AND WHAT IT DOES NOT DO. It does not detect a break sooner; it guarantees that
  # somebody eventually looks. Without it, this workflow runs only when I push, so a break that
  # arrives from OUTSIDE this repo is invisible until my next commit -- which is exactly how the
  # 2026-09-23 breakage sat unnoticed for hours in two repos at once, and gym's was found only
  # because gym happened to be committing. The timer BOUNDS the window at about a day rather
  # than shortening it, and that is the whole of its value.
  schedule:
    - cron: '0 11 * * *'

# WHY THE NIGHTLY MATTERS HERE AND NOT ONLY ON ci.yml, which is the less obvious half. The
# `full-stack` job below checks out RoyaleGym, RoyaleSim and RoyaleLearn at their DEFAULT BRANCH.
# So this workflow has the same external-dependency exposure as the cross-repo caller does: a
# sibling's commit can turn it red with no change in this repo and nothing in this history to
# point at. The integrator named that hazard for `ci.yml`; it is true of three checkouts here.

# The README's OWN commands, verbatim, on both platforms it documents. A workflow that installs
# some other way tests nothing a reader will experience, and this repo's published install block
# was broken for the whole public life of these repos without anyone noticing.
#
# TWO RUNNERS IS DELIBERATE AND IS NOT ABOUT THIS REPO BEING FUSSY. `..` normalises
# LEXICALLY on Windows and is walked COMPONENT BY COMPONENT on POSIX, so a path built with `..`
# and then stat-ed answers a different question per platform; the same is true of any code that
# compares paths as strings or assumes a separator. A single-OS matrix cannot see that class at
# all. It is not hypothetical: on 2026-09-23 a sibling repo's test passed on this Windows machine
# and failed on a clean Ubuntu runner for exactly that reason, and it was found the first time
# anybody looked. Deleting a runner here deletes the only instrument in the project that can see
# it.
#
# Two runners on purpose. The README is Windows-first and says of macOS and Linux only that "the
# interpreter is .venv/bin/python with forward slashes, and nothing else about the commands
# changes". That sentence had never been run on a POSIX machine -- there is no Linux or macOS
# machine in this project, which is why VISER-capture-posix was deferred rather than tested. The
# ubuntu leg is the first machine in this repo's life to check it, so a red ubuntu run is this
# job working rather than a fault to route around.
#
# The layout is the README's too: the repo is cloned INTO a folder beside a shared .venv, because
# that is what the install line assumes and a flat checkout would quietly test a path no reader
# takes.
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: RoyaleViser
          # FULL history, not the default shallow one. test_documented_counts asserts that the
          # commit each figure names resolves with `git cat-file -t`, which is the thing that
          # stops a number being quoted against a commit nobody can look up. A depth-1 clone has
          # none of them, so the guard fails for want of history rather than for a stale number.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install, the README's short way
        run: python -m venv .venv

      - name: install, the README's line
        shell: pwsh
        if: runner.os == 'Windows'
        run: .venv\Scripts\python -m pip install -e RoyaleViser

      - name: install, the README's line as it documents it for POSIX
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pip install -e RoyaleViser

      # pytest and ruff come from the README's "rest of the stack" line, not the short way, and
      # it says so. maturin is in that line and is not needed to run this repo's suite.
      - name: the tools the README's test section names
        shell: pwsh
        if: runner.os == 'Windows'
        run: .venv\Scripts\python -m pip install pytest hypothesis ruff

      - name: the tools the README's test section names
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pip install pytest hypothesis ruff

      # The README's media extra, so the mp4/gif encoder path is EXERCISED rather than skipped.
      # capture() writes PNG with nothing but this package; mp4 and gif go through the ffmpeg
      # binary imageio-ffmpeg ships. Until 2026-09-23 that path had only ever run on Windows --
      # VISER-capture-posix was deferred for want of a POSIX machine, and the ubuntu leg is one.
      # A separate step because it is an OPTIONAL extra: the install under test above stays the
      # README's short way verbatim, and this adds the feature the README documents separately.
      - name: the README's media extra
        shell: pwsh
        if: runner.os == 'Windows'
        run: .venv\Scripts\python -m pip install -e "RoyaleViser[media]"

      - name: the README's media extra
        if: runner.os != 'Windows'
        run: .venv/bin/python -m pip install -e "RoyaleViser[media]"

      # ROYALELIVE_REPORTS is deliberately unset: this is the CLONE case, which is the one a
      # contributor has. Four tests skip and each names its own remedy in the skip line.
      - name: suite
        shell: pwsh
        if: runner.os == 'Windows'
        working-directory: RoyaleViser
        run: ..\.venv\Scripts\python -m pytest -q

      - name: suite
        if: runner.os != 'Windows'
        working-directory: RoyaleViser
        run: ../.venv/bin/python -m pytest -q

      - name: ruff
        shell: pwsh
        if: runner.os == 'Windows'
        working-directory: RoyaleViser
        run: ..\.venv\Scripts\python -m ruff check royaleviser tests

      - name: ruff
        if: runner.os != 'Windows'
        working-directory: RoyaleViser
        run: ../.venv/bin/python -m ruff check royaleviser tests

      # COLLECTED, reported by the run rather than derived from its outcome line. The
      # integrator put "148 collected" in this repo's certification row by adding 139 passed
      # and 9 skipped, and that arithmetic is UNSOUND HERE: a module-level `importorskip`
      # yields ZERO collected items and ONE reported skip, so passed + skipped can exceed
      # collected and no sum recovers the difference. This repo has three such modules
      # (test_model.py, test_sources.py, test_learner_protocol.py), and the clone-shaped job
      # is exactly the environment where all three fire. The fix is not better arithmetic; it
      # is the run saying the number.
      # The venv interpreter, not a bare `pytest`: this job installs into .venv the README's
      # way, so pytest is not on PATH. The first version used bare pytest and exited 127 here
      # while passing in the full-stack job, which installs into the system python.
      - name: collected
        shell: pwsh
        if: ${{ always() && runner.os == 'Windows' }}
        working-directory: RoyaleViser
        run: |
          "collected on ${{ matrix.os }}:" >> $env:GITHUB_STEP_SUMMARY
          ..\.venv\Scripts\python -m pytest -q --collect-only | Select-Object -Last 1 | Tee-Object -Append $env:GITHUB_STEP_SUMMARY

      - name: collected
        shell: bash
        if: ${{ always() && runner.os != 'Windows' }}
        working-directory: RoyaleViser
        run: |
          echo "collected on ${{ matrix.os }}:" >> "$GITHUB_STEP_SUMMARY"
          ../.venv/bin/python -m pytest -q --collect-only 2>&1 | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      # Gym's rule: a count is never recorded without the build digest. This repo's suite runs
      # with no engine at all, so the honest record is that there was none rather than a blank.
      - name: record what this run was
        if: always()
        working-directory: RoyaleViser
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "os=${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          python -c "
          try:
              from royalegym.rust_engine import build_digest, core_available
              print('engine build_digest=', build_digest() if core_available() else 'no-extension')
          except Exception as e:
              print('engine build_digest= unavailable:', type(e).__name__)
          " >> "$GITHUB_STEP_SUMMARY"

  # A SECOND JOB, because the first one's honesty is the thing that leaves a hole.
  #
  # `suite` installs the README's SHORT WAY -- this package alone -- which is what a newcomer
  # gets and is why it caught a published install block that had never worked. But eight of its
  # nine skips have ONE cause: no sibling packages. Six name royalegym, one names royalelearn,
  # and the ninth is the documented-counts guard itself, which skips because "this environment
  # has no royalegym, so the collected total is a different population". So the unverified
  # counts and the eight dark tests were never two problems. They are one, and installing the
  # stack in a job of its own fixes both permanently rather than once.
  #
  # `suite` keeps doing the thing only it can do. This job does the thing only it can do. The
  # engine-backed tests still skip here, because royalesim needs a compiled extension and
  # nothing builds one yet -- that is sim's cross-repo callee, still a no-op echo, and it is
  # the same missing build that leaves tests dark in four repos.
  #
  # bash on both platforms, unlike `suite`, and deliberately: README FIDELITY is `suite`'s job,
  # so this one is free to use whatever is shortest. Two copies of the same commands would rot.
  full-stack:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: RoyaleViser
          fetch-depth: 0
      - uses: actions/checkout@v4
        with: { repository: RoyaleGym/RoyaleGym, path: RoyaleGym }
      - uses: actions/checkout@v4
        with: { repository: RoyaleGym/RoyaleSim, path: RoyaleSim }
      - uses: actions/checkout@v4
        with: { repository: RoyaleGym/RoyaleLearn, path: RoyaleLearn }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # WHICH SIBLINGS THIS RUN ACTUALLY USED. The three checkouts above take the DEFAULT
      # BRANCH, so this job's result is not determined by this repo's commit alone: the same
      # commit can be green today and red tomorrow with nothing in its history changing. That
      # is not a fault to pin away -- a repo's suite SHOULD be tested against its siblings'
      # current state -- but it makes a certification non-reproducible unless the run says what
      # it ran against. So it says.
      #
      # ABSENT rather than a skipped line when a checkout is missing, because a missing figure
      # and a resolved one must not look alike. That is the same rule as every other unreadable
      # number here: a reader cannot tell "nothing to report" from "nobody reported".
      - name: which siblings this ran against
        if: always()
        shell: bash
        run: |
          echo "siblings on ${{ matrix.os }}:" >> "$GITHUB_STEP_SUMMARY"
          for repo in RoyaleGym RoyaleSim RoyaleLearn; do
            if [ -d "$repo/.git" ]; then
              echo "  $repo=$(git -C "$repo" rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "  $repo=ABSENT" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      # The README's Stage 3. RoyaleSim's tables are GENERATED rather than stored, so a fresh
      # clone has none and `default_board()` would have no arena to load. Learn lost two CI runs
      # to skipping this; taking its recipe rather than rediscovering it.
      - name: generate RoyaleSim's data tables
        working-directory: RoyaleSim
        shell: bash
        run: |
          python tools/extract_arena.py
          python tools/extract_cards.py --vintage 2018
          python tools/extract_cards.py --vintage 2018 --out data/derived/cards.json
          python tools/extract_globals.py

      - name: install the stack
        shell: bash
        run: |
          python -m pip install -e RoyaleGym
          python -m pip install -e RoyaleLearn
          python -m pip install -e "RoyaleViser[media]"
          python -m pip install pytest hypothesis ruff

      # ROYALELIVE_REPORTS stays unset: the recordings are private and those tests skip here as
      # they do everywhere. That is the ONE boundary this job does not cross, and it is inherent
      # rather than a debt.
      - name: suite
        working-directory: RoyaleViser
        shell: bash
        run: pytest -q

      # COLLECTED, reported by the run rather than derived from its outcome line. A module-level
      # `importorskip` yields ZERO collected items and ONE reported skip, so passed + skipped can
      # EXCEED collected and no sum recovers the difference. This repo has three such modules.
      # The integrator put "148 collected" in its certification row by summing 139 and 9; no run
      # ever reported that number. The fix is not better arithmetic, it is the run saying it.
      - name: collected
        working-directory: RoyaleViser
        shell: bash
        if: always()
        run: |
          echo "collected on ${{ matrix.os }}:" >> "$GITHUB_STEP_SUMMARY"
          pytest -q --collect-only 2>&1 | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: record what this run was
        if: always()
        working-directory: RoyaleViser
        shell: bash
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "os=${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          python -c "
          try:
              from royalegym.rust_engine import build_digest, core_available
              print('engine build_digest=', build_digest() if core_available() else 'no-extension')
          except Exception as e:
              print('engine build_digest= unavailable:', type(e).__name__)
          " >> "$GITHUB_STEP_SUMMARY"
